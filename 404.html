    <style>

      body {

      }
      .urdu { font-family: "Noto Nastaliq Urdu", serif; line-height: 2.1; }

      /* ---------- header ---------- */
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px;
        max-width: 1060px; margin: 0 auto;
      }
      header img.logo {

      }
      header .brand { font-weight: 800; font-size: 20px; letter-spacing: 0.2px; }
      header .brand small {
        display: block; font-weight: 500; font-size: 12.5px; color: var(--ink-dim);
      }

      main { max-width: 1060px; margin: 0 auto; padding: 0 16px 40px; }

      /* ---------- hero: the book, centre stage ---------- */
      .hero { text-align: center; padding: 10px 0 4px; }
      .hero-stage { position: relative; width: min(330px, 74vw); margin: 0 auto; }
      .hero-stage::before {
        content: ""; position: absolute; inset: 12% 6% auto; height: 62%;
        background: radial-gradient(closest-side, rgba(232, 185, 60, 0.35), transparent);
        filter: blur(10px); z-index: 0;
      }
      .hero-stage img {
        position: relative; z-index: 1; width: 100%; height: auto; display: block;
        border-radius: 26px;

      }
      @keyframes bookFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-stage img { animation: none; }
      }
      .hero h1 {
        margin: 14px 0 4px; font-size: clamp(30px, 6.4vw, 46px); font-weight: 800;
        line-height: 1.12;
      }
      .hero h1 .gold { color: var(--gold); }
      .hero .tagline {
        margin: 6px auto 0; max-width: 560px;
        font-size: clamp(16px, 3.6vw, 20px); color: var(--ink-dim); font-weight: 500;
      }
      .hero .tagline .urdu { color: var(--gold-soft); font-size: 1.06em; }

      /* ---------- steps ---------- */
      .steps {
        display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
        margin: 22px auto 6px; max-width: 640px;

        width: 28px; height: 28px; border-radius: 50%; flex: none;

        border-radius: var(--radius); padding: 18px; margin-top: 18px;
      }

        border-radius: 16px; padding: 14px 18px;
        background: linear-gradient(180deg, var(--gold-soft), var(--gold));
        color: #241a02; font-family: inherit;
        font-size: clamp(20px, 4.6vw, 24px); font-weight: 800;

      .photo-name {

        min-height: 18px; overflow-wrap: anywhere;

      .group-label:first-of-type { margin-top: 16px; }
      .choices { display: grid; gap: 10px; }
      .choices.langs { grid-template-columns: repeat(3, 1fr); }
      .choices.modes { grid-template-columns: 1fr 1fr; }
      @media (max-width: 560px) {
        .choices.langs { grid-template-columns: 1fr 1fr 1fr; }
        .choices.modes { grid-template-columns: 1fr; }

      .choice {
        border: 2px solid var(--line); background: var(--panel-2);
        color: var(--ink); border-radius: 14px; cursor: pointer;
        min-height: 62px; padding: 10px 12px; font-family: inherit;
        font-size: 17px; font-weight: 700; text-align: center;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        transition: border-color 0.12s ease, background 0.12s ease;
      }
      .choice small { font-weight: 500; font-size: 12.5px; color: var(--ink-dim); }
      .choice[aria-pressed="true"] {
        border-color: var(--gold);

      .engine-note {
        margin: 14px 2px 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-dim);
        text-align: center;
      }
      .engine-note strong { color: var(--gold-soft); }

      /* ---------- the open book ---------- */
      .book-wrap { margin-top: 26px; }
      .book-title {
        text-align: center; font-weight: 800; font-size: 19px; margin: 0 0 12px;
      }
      .book {
        display: grid; grid-template-columns: 1fr 1fr;
        background: linear-gradient(180deg, #2a1f0d, #1c1508);
        padding: 12px; border-radius: 22px; gap: 0;

        border: 1px solid rgba(232, 185, 60, 0.35);
      }
      .page {
        background: linear-gradient(180deg, var(--paper), var(--paper-2));
        color: var(--paper-ink); min-height: 340px;
        padding: 20px 20px 24px; position: relative;
        display: flex; flex-direction: column;
      }
      .page.left {
        border-radius: 8px 2px 2px 8px;
        box-shadow: inset -18px 0 24px -18px rgba(60, 45, 10, 0.55);
      }
      .page.right {
        border-radius: 2px 8px 8px 2px;
        box-shadow: inset 18px 0 24px -18px rgba(60, 45, 10, 0.55);
      }
      @media (max-width: 720px) {
        .book { grid-template-columns: 1fr; gap: 10px; }
        .page { min-height: 240px; }
        .page.left { border-radius: 8px; box-shadow: inset 0 -16px 22px -16px rgba(60, 45, 10, 0.5); }
        .page.right { border-radius: 8px; box-shadow: inset 0 16px 22px -16px rgba(60, 45, 10, 0.5); }
      }
      .page-tag {

      .page-empty {

      .page-photo { width: 100%; height: auto; border-radius: 6px; display: block; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }

      .spinner {

        animation: spin 0.9s linear infinite; margin: 8px auto;

      /* built-in sample textbook page */
      .sample-page { text-align: right; }
      .sample-page .sample-head {
        text-align: center; border: 2px solid #7a5a0a; border-radius: 10px;
        padding: 8px 10px 12px; margin-bottom: 14px; background: rgba(232, 185, 60, 0.12);

      .sample-page .sample-head .urdu { font-size: 21px; font-weight: 700; color: #4a3605; line-height: 1.9; }

      .sample-page p.urdu { font-size: 17.5px; color: var(--paper-ink); margin: 0 0 10px; }
      .sample-page .art { text-align: center; margin: 8px 0 4px; }

      /* ---------- voice bar ---------- */
      .voice-bar {
        display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 16px;
      }
      @media (max-width: 480px) { .voice-bar { grid-template-columns: 1fr; } }
      .btn-speak {
        min-height: 68px; border: none; border-radius: 16px; cursor: pointer;
        background: linear-gradient(180deg, var(--gold-soft), var(--gold));
        color: #241a02; font-family: inherit; font-size: 22px; font-weight: 800;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        box-shadow: 0 10px 26px rgba(232, 185, 60, 0.25);

        display: flex; align-items: center; justify-content: center; gap: 8px;

      .btn-stop:disabled { opacity: 0.45; cursor: not-allowed; }
      .voice-note { text-align: center; color: var(--ink-dim); font-size: 14px; margin: 10px 0 0; min-height: 18px; }

      /* ---------- who it is for ---------- */
      .for-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; }
      @media (max-width: 640px) { .for-grid { grid-template-columns: 1fr; } }
      .for-item {

      .for-item h3 { margin: 6px 0 4px; font-size: 17px; }

        border: 2px solid var(--gold); display: block; margin: 0 auto 10px;
      }
      footer p { margin: 0; font-size: 14px; color: var(--ink-dim); font-weight: 600; line-height: 1.6; }
      footer p strong { color: var(--ink); }

      /* ---------- AI assistant — compact Rehan-style in-flow card ----------
         Modelled on the rehan.education dashboard assistant: a small,
         neat content card INSIDE the page layout, in the top row's
         right column beside the hero — always visible, open by
         default, covering nothing. Never a floating overlay, never a
         launcher pill. Kept deliberately compact: slim robot-tile
         header, one short greeting bubble, small suggestion chips and
         a pill composer with a round gold send button. Paper-white
         like a page of the book. The header chevron collapses the
         body inside the card. On narrow screens the card stacks
         in-flow below the hero. */
      .top-row {
        display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start;
      }
      @media (min-width: 1024px) {
        .top-row { grid-template-columns: minmax(0, 1fr) 318px; }
      }
      .asst-card {
        width: 100%;

        background: #fffdf4; color: #26221a;
        border: 1px solid rgba(38, 34, 26, 0.1);
        border-radius: 16px; overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        font-family: "Outfit", system-ui, sans-serif;

      .asst-head {
        display: flex; align-items: center; gap: 8px;

        background: #fffdf4;
        border-bottom: 1px solid #f1e8cd;
      }
      .asst-robot {
        width: 30px; height: 30px; border-radius: 9px; flex: none;
        display: grid; place-items: center;
        background: linear-gradient(160deg, var(--gold-soft), var(--gold));
        box-shadow: 0 4px 10px rgba(232, 185, 60, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5);

      .asst-titles { flex: 1; min-width: 0; }
      .asst-titles strong { display: block; font-size: 14px; font-weight: 800; color: #26221a; letter-spacing: 0.1px; line-height: 1.2; }
      .asst-titles small { display: block; font-size: 11px; color: #8a8163; font-weight: 500; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .asst-toggle {
        width: 28px; height: 28px; border-radius: 50%; flex: none;
        border: none; background: transparent; color: #98906f;
        cursor: pointer; line-height: 1;
        display: grid; place-items: center; font-family: inherit;
        transition: background 0.12s ease, color 0.12s ease, transform 0.15s ease;
      }
      .asst-toggle:hover { background: #f6eed3; color: #4c4630; }
      .asst-card.collapsed .asst-toggle { transform: rotate(-90deg); }
      .asst-card.collapsed .asst-body { display: none; }
      .asst-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }

        padding: 8px; display: flex; flex-direction: column; gap: 6px;
        overflow-y: auto; flex: 1; min-height: 0; max-height: 118px;
      }

        max-width: 94%; padding: 7px 9px; border-radius: 12px;
        font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere;
      }
      .asst-msg.bot {
        align-self: flex-start; background: #faf2d7; color: #33301f;
        border-bottom-left-radius: 5px; white-space: pre-wrap;
      }
      .asst-msg.rich { white-space: normal; }
      .asst-msg.rich p { margin: 0 0 5px; }
      .asst-msg.rich p:last-child { margin-bottom: 0; }
      .asst-msg.rich .g-lead { font-size: 12.5px; }
      .asst-msg.rich ul { margin: 2px 0 10px; padding-left: 18px; }
      .asst-msg.rich li { margin: 4px 0; }
      .asst-msg.rich .g-note { font-size: 12px; color: #8a8163; line-height: 1.55; }
      .asst-msg.user {
        align-self: flex-end; background: linear-gradient(180deg, var(--gold-soft), var(--gold));
        color: #241a02; font-weight: 600; border-bottom-right-radius: 5px; white-space: pre-wrap;
      }
      .asst-msg.typing { display: flex; align-items: center; gap: 5px; min-height: 30px; }
      .asst-msg.typing .tdot {
        width: 7px; height: 7px; border-radius: 50%; background: #b3a678; flex: none;
        animation: asstBlink 1.1s ease-in-out infinite;
      }
      .asst-msg.typing .tdot:nth-child(2) { animation-delay: 0.18s; }
      .asst-msg.typing .tdot:nth-child(3) { animation-delay: 0.36s; }
      @keyframes asstBlink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .asst-msg.typing .tdot { animation: none; opacity: 0.6; }
        .asst-toggle { transition: none; }
      }
      .asst-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 8px 8px; flex: none; }
      .asst-chip {
        border: 1px solid #e9dfba; background: #ffffff; color: #4c4630;
        border-radius: 999px; padding: 4px 8px; font-size: 11.5px; font-weight: 600;
        cursor: pointer; font-family: inherit;
        box-shadow: 0 1px 3px rgba(38, 34, 26, 0.08);
        transition: border-color 0.12s ease, background 0.12s ease;
      }
      .asst-chip:hover { border-color: var(--gold); background: #fdf6dd; }
      .asst-input {
        display: flex; gap: 6px; padding: 7px 8px 8px; flex: none;
        border-top: 1px solid #f1e8cd; align-items: center; background: #fffdf4;
      }
      .asst-input input {
        flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 999px;
        background: #f6f1de; color: #26221a;
        padding: 7px 11px; font-size: 12.5px; font-family: inherit; outline: none;
        transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .asst-input input:focus { background: #ffffff; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232, 185, 60, 0.18); }
      .asst-input input::placeholder { color: #a29a7d; }
      .asst-send {
        width: 32px; height: 32px; border-radius: 50%; flex: none; border: none; cursor: pointer;
        background: linear-gradient(180deg, var(--gold-soft), var(--gold));
        display: grid; place-items: center;
        box-shadow: 0 6px 16px rgba(232, 185, 60, 0.35);
      }
      .asst-send:active { transform: scale(0.94); }
      .hidden { display: none !important; }
